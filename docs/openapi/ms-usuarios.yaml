openapi: 3.0.3
info:
  title: ms-usuarios API
  description: Autenticación, registro y gestión de usuarios del sistema de reserva de canchas deportivas.
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Registro e inicio de sesión
  - name: Usuarios
    description: Gestión de usuarios (requiere rol ADMINISTRADOR salvo /me)

paths:
  /api/v1/auth/registro:
    post:
      tags: [Auth]
      summary: Registrar nuevo usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              nombre: "Ana Torres"
              email: "ana@ejemplo.com"
              password: "secreto123"
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión y obtener token JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "ana@ejemplo.com"
              password: "secreto123"
      responses:
        '200':
          description: Token JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/usuarios/me:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario autenticado
      responses:
        '200':
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/usuarios:
    get:
      tags: [Usuarios]
      summary: Listar todos los usuarios (ADMINISTRADOR)
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/usuarios/{id}/estado:
    patch:
      tags: [Usuarios]
      summary: Activar o desactivar un usuario (ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoRequest'
            example:
              activo: false
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    RegistroRequest:
      type: object
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 180
        password:
          type: string
          minLength: 8
          maxLength: 72

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      properties:
        tokenAcceso:
          type: string
        tipoToken:
          type: string
          example: Bearer
        expiraEnSegundos:
          type: integer
          format: int64

    EstadoRequest:
      type: object
      required: [activo]
      properties:
        activo:
          type: boolean

    UsuarioResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
        creadoEn:
          type: string
          format: date-time

    Rol:
      type: string
      enum: [USUARIO, ADMINISTRADOR]

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sin permisos suficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto de datos (p. ej. email duplicado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
