openapi: 3.0.3
info:
  title: ms-canchas API
  description: Canchas, deportes, horarios y bloqueos de mantenimiento.
  version: 1.0.0

servers:
  - url: http://localhost:8082
    description: Local

security:
  - bearerAuth: []

tags:
  - name: Canchas
    description: CRUD de canchas deportivas
  - name: Mantenimientos
    description: Bloqueos de mantenimiento por cancha

paths:
  /api/v1/canchas:
    get:
      tags: [Canchas]
      summary: Listar canchas
      security: []
      parameters:
        - name: soloActivas
          in: query
          schema:
            type: boolean
            default: true
          description: Si es true devuelve únicamente canchas activas
      responses:
        '200':
          description: Lista de canchas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanchaResponse'

    post:
      tags: [Canchas]
      summary: Crear cancha (ADMINISTRADOR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanchaRequest'
            example:
              nombre: "Cancha de Pádel 1"
              deporte: "PADEL"
              horaApertura: "08:00:00"
              horaCierre: "22:00:00"
      responses:
        '201':
          description: Cancha creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/canchas/{id}:
    put:
      tags: [Canchas]
      summary: Actualizar cancha (ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanchaRequest'
      responses:
        '200':
          description: Cancha actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/canchas/{id}/estado:
    patch:
      tags: [Canchas]
      summary: Activar o desactivar cancha (ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoRequest'
            example:
              activa: false
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanchaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/canchas/{id}/mantenimientos:
    post:
      tags: [Mantenimientos]
      summary: Crear bloqueo de mantenimiento (ADMINISTRADOR)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MantenimientoRequest'
            example:
              inicio: "2026-09-01T08:00:00-05:00"
              fin: "2026-09-01T12:00:00-05:00"
              motivo: "Pintura de líneas"
      responses:
        '201':
          description: Bloqueo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MantenimientoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags: [Mantenimientos]
      summary: Listar mantenimientos de una cancha
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lista de bloqueos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MantenimientoResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Deporte:
      type: string
      enum: [PADEL, TENIS, BASQUET]

    CanchaRequest:
      type: object
      required: [nombre, deporte, horaApertura, horaCierre]
      properties:
        nombre:
          type: string
          maxLength: 120
        deporte:
          $ref: '#/components/schemas/Deporte'
        horaApertura:
          type: string
          format: time
          example: "08:00:00"
        horaCierre:
          type: string
          format: time
          example: "22:00:00"

    EstadoRequest:
      type: object
      required: [activa]
      properties:
        activa:
          type: boolean

    MantenimientoRequest:
      type: object
      required: [inicio, fin, motivo]
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        motivo:
          type: string
          maxLength: 250

    CanchaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        deporte:
          $ref: '#/components/schemas/Deporte'
        horaApertura:
          type: string
          format: time
          example: "08:00:00"
        horaCierre:
          type: string
          format: time
          example: "22:00:00"
        activa:
          type: boolean

    MantenimientoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        canchaId:
          type: string
          format: uuid
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        motivo:
          type: string

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sin permisos suficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
