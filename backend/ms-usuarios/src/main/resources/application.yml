server:
  port: 8081

spring:
  application:
    name: ms-usuarios
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/usuarios_db}
    username: ${DB_USERNAME:reservas}
    password: ${DB_PASSWORD:reservas_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  service-api-key: ${SERVICE_API_KEY:change-this-internal-service-key}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123*}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
