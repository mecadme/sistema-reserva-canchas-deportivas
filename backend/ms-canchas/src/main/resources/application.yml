server:
  port: 8082
spring:
  application:
    name: ms-canchas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/canchas_db}
    username: ${DB_USERNAME:reservas}
    password: ${DB_PASSWORD:reservas_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
  service-api-key: ${SERVICE_API_KEY:change-this-internal-service-key}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
