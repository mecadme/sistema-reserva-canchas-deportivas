server:
  port: 8084
spring:
  application:
    name: ms-reportes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/reportes_db}
    username: ${DB_USERNAME:reservas}
    password: ${DB_PASSWORD:reservas_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
  service-api-key: ${SERVICE_API_KEY:change-this-internal-service-key}
services:
  reservas-url: ${RESERVAS_URL:http://localhost:8083}
  canchas-url: ${CANCHAS_URL:http://localhost:8082}
business:
  zone-id: ${BUSINESS_ZONE_ID:America/Guayaquil}
  slot-minutes: ${SLOT_MINUTES:60}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
